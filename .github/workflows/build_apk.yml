name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          cache: true

      - name: Ensure Assets Directory
        run: |
          mkdir -p assets/images
          touch assets/images/.gitkeep

      - name: Get Dependencies
        run: flutter pub get

      - name: Create & Fix Android Project
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.example

          # Python orqali Gradle va Kotlin versiyalarini bir lahzada to'g'rilaymiz
          python3 -c "
          import re

          # 1. Root build.gradle update (Kotlin -> 1.9.20 & Ext variables)
          root_gradle = 'android/build.gradle'
          with open(root_gradle, 'r') as f:
              content = f.read()

          content = re.sub(r'ext\.kotlin_version\s*=\s*[\"'].*?[\"']', 'ext.kotlin_version = \"1.9.20\"', content)
          ext_block = '''
          allprojects {
              ext.compileSdkVersion = 35
              ext.targetSdkVersion = 35
              ext.minSdkVersion = 21
          }
          '''
          with open(root_gradle, 'w') as f:
              f.write(ext_block + '\n' + content)

          # 2. app/build.gradle update (compileSdk = 35 & Desugaring)
          app_gradle = 'android/app/build.gradle'
          with open(app_gradle, 'r') as f:
              ac = f.read()

          ac = re.sub(r'compileSdk\s*=.*', 'compileSdk = 35', ac)
          ac = re.sub(r'targetSdk\s*=.*', 'targetSdk = 35', ac)
          ac = ac.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true')
          ac += '\ndependencies {\n    coreLibraryDesugaring \"com.android.tools:desugar_jdk_libs:2.0.4\"\n}\n'

          with open(app_gradle, 'w') as f:
              f.write(ac)
          "

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
