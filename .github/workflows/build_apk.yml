name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Re-create Android files correctly
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.example

      - name: Inject Legacy Gradle Properties & SDK 35
        run: |
          python3 -c "
          # 1. build.gradle (app) ichiga compileSdk 35 joylash
          app_gradle = 'android/app/build.gradle'
          with open(app_gradle, 'r') as f:
              c = f.read()
          
          c = c.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 35')
          c = c.replace('compileSdkVersion flutter.compileSdkVersion', 'compileSdkVersion 35')
          c = c.replace('targetSdk = flutter.targetSdkVersion', 'targetSdk = 35')
          
          with open(app_gradle, 'w') as f:
              f.write(c)

          # 2. Root build.gradle ga ext xossalarini qo'shish (package_info_plus va audioplayers uchun)
          root_gradle = 'android/build.gradle'
          with open(root_gradle, 'r') as f:
              rg = f.read()
          
          ext_block = '''
          buildscript {
              ext.kotlin_version = '1.9.22'
              ext.compileSdkVersion = 35
              ext.minSdkVersion = 21
              ext.targetSdkVersion = 35
          }
          '''
          with open(root_gradle, 'w') as f:
              f.write(ext_block + '\n' + rg)
          "

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
