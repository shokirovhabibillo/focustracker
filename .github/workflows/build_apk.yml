name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          cache: true

      - name: Ensure Assets Directory
        run: |
          mkdir -p assets/images
          touch assets/images/.gitkeep

      - name: Get Dependencies
        run: flutter pub get

      - name: Re-create Android Project
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.example

      - name: Fix Legacy Plugin Values & Properties
        run: |
          # 1. local.properties yaratish (SDK va Flutter versiyasi uchun)
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties
          echo "flutter.buildMode=release" >> android/local.properties
          echo "flutter.versionName=1.0.0" >> android/local.properties
          echo "flutter.versionCode=1" >> android/local.properties

          # 2. gradle.properties ichiga global SDK va Desugaring qiymatlarini kiritish
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties
          echo "flutter.compileSdkVersion=35" >> android/gradle.properties
          echo "flutter.targetSdkVersion=35" >> android/gradle.properties
          echo "flutter.minSdkVersion=21" >> android/gradle.properties

          # 3. Root build.gradle ga plaginlar o'qiy oladigan ext blokini qo'shish
          python3 -c "
          with open('android/build.gradle', 'r') as f:
              content = f.read()
          
          ext_block = '''
          allprojects {
              ext.compileSdkVersion = 35
              ext.targetSdkVersion = 35
              ext.minSdkVersion = 21
          }
          '''
          with open('android/build.gradle', 'w') as f:
              f.write(ext_block + '\n' + content)
          
          # app/build.gradle ichiga desugaring sozlamalarini xatosiz qo'shish
          with open('android/app/build.gradle', 'r') as f:
              app_content = f.read()
          
          app_content = app_content.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true')
          app_content += '\ndependencies {\n    coreLibraryDesugaring \"com.android.tools:desugar_jdk_libs:2.0.4\"\n}\n'
          
          with open('android/app/build.gradle', 'w') as f:
              f.write(app_content)
          "

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
