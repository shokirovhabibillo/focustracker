name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          cache: true

      - name: Ensure Assets Directory
        run: |
          mkdir -p assets/images
          touch assets/images/.gitkeep

      - name: Get Dependencies
        run: flutter pub get

      - name: Re-create Android Project
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.example --android-language java

      - name: Generate local.properties & Fix Gradle Config
        run: |
          # 1. local.properties yaratish
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties
          echo "flutter.buildMode=release" >> android/local.properties
          echo "flutter.versionName=1.0.0" >> android/local.properties
          echo "flutter.versionCode=1" >> android/local.properties

          # 2. compileSdk 35, Desugaring va NDK versiyasini aniq qo'shish
          python3 -c "
          app_gradle = 'android/app/build.gradle'
          with open(app_gradle, 'r') as f:
              c = f.read()

          # compileSdk va targetSdk ni to'g'ri o'rnatish
          import re
          c = re.sub(r'compileSdk\s*=.*', 'compileSdk = 35', c)
          c = re.sub(r'compileSdkVersion\s+.*', 'compileSdkVersion 35', c)
          c = re.sub(r'targetSdk\s*=.*', 'targetSdk = 35', c)
          c = re.sub(r'targetSdkVersion\s+.*', 'targetSdkVersion 35', c)

          c = c.replace('android {', 'android {\n    compileSdkVersion 35\n    ndkVersion \"27.0.12077973\"')
          c = c.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true')
          
          c += '\ndependencies {\n    coreLibraryDesugaring \"com.android.tools:desugar_jdk_libs:2.0.4\"\n}\n'

          with open(app_gradle, 'w') as f:
              f.write(c)
          "

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
