name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          cache: true

      - name: Ensure Assets Directory
        run: |
          mkdir -p assets/images
          touch assets/images/.gitkeep

      - name: Get Dependencies
        run: flutter pub get

      - name: Re-create Android Project
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.example

      - name: Configure Android Gradle (SDK 35 & Desugaring)
        run: |
          # SDK 35 ga ko'tarish
          sed -i 's/compileSdk = .*/compileSdk = 35/g' android/app/build.gradle
          sed -i 's/targetSdk = .*/targetSdk = 35/g' android/app/build.gradle

          # Desugaring yoqish
          sed -i 's/compileOptions {/compileOptions {\n        coreLibraryDesugaringEnabled true/g' android/app/build.gradle
          echo -e '\ndependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"\n}' >> android/app/build.gradle

          # Kotlin versiyasini oshirish
          echo "ext.kotlin_version = '1.9.20'" >> android/build.gradle
          echo "allprojects { ext.compileSdkVersion = 35; ext.targetSdkVersion = 35; ext.minSdkVersion = 21 }" >> android/build.gradle

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
