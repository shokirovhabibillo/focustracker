name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Re-create Android files
        run: |
          rm -rf android
          flutter create . --platforms=android --org com.example

      - name: Set compileSdkVersion to 35
        run: |
          python3 -c "
          path = 'android/app/build.gradle'
          with open(path, 'r') as f:
              content = f.read()
          content = content.replace('compileSdk = flutter.compileSdkVersion', 'compileSdk = 35')
          content = content.replace('compileSdkVersion flutter.compileSdkVersion', 'compileSdkVersion 35')
          with open(path, 'w') as f:
              f.write(content)
          "

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
