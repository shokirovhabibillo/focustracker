plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.example.focustracker"
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    defaultConfig {
        applicationId "com.example.focustracker"
        minSdk 21
        targetSdk 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}

configurations.all {
    resolutionStrategy {
        // Barcha kutubxonalar va ularning qaramliklarida Kotlin stdlib'ni 1.9.20 ga majburlaymiz
        force "org.jetbrains.kotlin:kotlin-stdlib:1.9.20"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.20"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.20"
        force "org.jetbrains.kotlin:kotlin-stdlib-common:1.9.20"
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.20')
}
